name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            install: |
              sudo apt-get update
              sudo apt-get install -y \
                build-essential \
                cmake \
                ninja-build \
                pkg-config \
                libx11-dev \
                libxext-dev \
                libxrandr-dev \
                libxinerama-dev \
                libxcursor-dev \
                libxi-dev \
                libxss-dev \
                libwayland-dev \
                libxkbcommon-dev \
                libdrm-dev \
                libgbm-dev \
                libpulse-dev \
                libasound2-dev
              git clone https://github.com/libsdl-org/SDL.git
              cd SDL
              git checkout release-3.4.16
              cmake -S . -B build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DSDL_TESTS=OFF \
                -DSDL_EXAMPLES=OFF \
                -DSDL_X11_XSCRNSAVER=OFF \
                -DSDL_X11_XTEST=OFF
              cmake --build build
              sudo cmake --install build
              sudo ldconfig
            configure: |
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: |
              cmake --build build --parallel

          - os: macos-14
            name: macOS arm64
            install: |
              brew update
              brew install cmake pkg-config sdl3
            configure: |
              export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
              export CMAKE_PREFIX_PATH="/opt/homebrew"
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: |
              cmake --build build --parallel

          - os: windows-latest
            name: Windows x64
            install: |
              choco install cmake ninja pkgconf -y
              if (!(Test-Path "$env:USERPROFILE\vcpkg")) { git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg" }
              & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
              & "$env:USERPROFILE\vcpkg\vcpkg.exe" install sdl3:x64-windows --triplet x64-windows
            configure: |
              $pkgConfig = (Get-Command pkg-config -ErrorAction SilentlyContinue -CommandType Application)
              if (-not $pkgConfig) { $pkgConfig = (Get-Command pkgconf -ErrorAction SilentlyContinue -CommandType Application) }
              if (-not $pkgConfig) { throw "pkg-config/pkgconf could not be found in PATH after install." }
              $env:PKG_CONFIG_EXECUTABLE = $pkgConfig.Source
              $env:PKG_CONFIG_PATH = "$env:USERPROFILE\vcpkg\installed\x64-windows\lib\pkgconfig"
              $env:CMAKE_PREFIX_PATH = "$env:USERPROFILE\vcpkg\installed\x64-windows"
              cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:USERPROFILE\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
            build: |
              cmake --build build --parallel --config Release

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.install }}

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.install }}

      - name: Configure build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.configure }}

      - name: Configure build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.configure }}

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.build }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.build }}
